<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Clinic Map Locator</title>
    <!-- CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Tus estilos actualizados -->
    <link rel="stylesheet" href="map.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            position: relative;
            font-size: 16px;
        }
        
        /* Recommended iframe resolution: 1366x768 (laptop/desktop standard) */
        body {
            max-width: 1366px;
            max-height: 768px;
            margin: 0 auto;
        }
        
        #map-section {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            max-width: 1366px;
            max-height: 768px;
            margin: 0 auto;
        }
        
        #map {
            width: 100%;
            height: 100%;
        }
        
        /* Responsive scaling for various screen sizes */
        @media (max-width: 1366px) {
            body, #map-section {
                max-width: 100%;
                max-height: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Barra de búsqueda flotante superior centrada -->
    <div id="search-container">
        <input type="text" id="searchInput" placeholder="Buscar dirección o Plus Code..." onkeydown="if(event.key === 'Enter') findNearest();" />
        <button onclick="findNearest()">Buscar</button>
        <button onclick="clearSearch()" title="Limpiar">✕</button>
    </div>

    <!-- Contenedor único del mapa -->
    <div id="map-section">
        <div id="map"></div>
    </div>

    <!-- Script de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Tu lógica -->
    <script src="map.js"></script>
    <script>
        // Disparar la carga directamente al arrancar la página
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof loadData === 'function') {
                loadData();
            }
        });
        
        // Override Power Apps iframe resolution constraints
        // Force viewport to recommended resolution: 1366x768 (laptop/desktop standard)
        window.addEventListener('load', () => {
            const mapSection = document.getElementById('map-section');
            if (mapSection) {
                // Reset any Power Apps imposed constraints
                mapSection.style.maxWidth = '1366px';
                mapSection.style.maxHeight = '768px';
                mapSection.style.width = '100%';
                mapSection.style.height = '100%';
            }
        });
        
        // Additional measure: Communicate with parent iframe about recommended size
        if (window.parent !== window) {
            window.parent.postMessage({
                type: 'MAP_READY',
                recommendedWidth: 1366,
                recommendedHeight: 768,
                aspectRatio: '16:9',
                displayMode: 'desktop'
            }, '*');
        }
    </script>
</body>
</html>
