<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Clinic Map Locator</title>
    <!-- CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Tus estilos actualizados -->
    <link rel="stylesheet" href="map.css">
    <style>
        /* Forzar comportamiento full-screen: ocupar toda la ventana del navegador */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            position: relative;
            font-size: 16px;
        }

        /* Contenedor del mapa fijado a toda la ventana (fullscreen) */
        #map-section {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            z-index: 0;
        }

        /* Mapa ocupa todo el contenedor */
        #map {
            width: 100%;
            height: 100%;
        }

        /* Ajustes para la barra de búsqueda en pantallas pequeñas */
        @media (max-width: 480px) {
            #searchInput { width: 140px; }
        }
    </style>
</head>
<body>

    <!-- Barra de búsqueda flotante superior centrada -->
    <div id="search-container">
        <input type="text" id="searchInput" placeholder="Buscar dirección o Plus Code..." onkeydown="if(event.key === 'Enter') findNearest();" />
        <button onclick="findNearest()">Buscar</button>
        <button onclick="clearSearch()" title="Limpiar">✕</button>
    </div>

    <!-- Contenedor único del mapa -->
    <div id="map-section">
        <div id="map"></div>
    </div>

    <!-- Script de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Tu lógica -->
    <script src="map.js"></script>
    <script>
        // Aseguramos que no se reimpongan restricciones de tamaño desde este archivo.
        window.addEventListener('load', () => {
            const mapSection = document.getElementById('map-section');
            if (mapSection) {
                // Eliminar cualquier restricción de tamaño aplicada externamente
                mapSection.style.maxWidth = '';
                mapSection.style.maxHeight = '';
                mapSection.style.width = '100%';
                mapSection.style.height = '100%';
            }

            // Forzar re-cálculo de tamaño del mapa si la librería ya está cargada
            setTimeout(() => { try { window.AppMap?.invalidate?.(); } catch (_) {} }, 150);
            setTimeout(() => { try { window.AppMap?.invalidate?.(); } catch (_) {} }, 500);
        });

        // Comunicar al contenedor padre que el mapa está listo (puede seguir enviando recomendaciones)
        if (window.parent !== window) {
            window.parent.postMessage({
                type: 'MAP_READY',
                recommendedWidth: 1366,
                recommendedHeight: 768,
                aspectRatio: '16:9',
                displayMode: 'desktop'
            }, '*');
        }
    </script>
</body>
</html>
