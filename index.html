<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Clinic Map Locator</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Unified Stylesheet -->
    <link rel="stylesheet" href="map.css">
    <style>
        /* === Fixed Right-Side Vertically Centered Panel === */
        #clinic-details-panel {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            width: 360px;
            max-height: 85vh;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #clinic-details-panel.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%);
            display: flex;
        }

        /* === Header matching reference UI === */
        #clinic-panel-header {
            padding: 14px 16px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-shrink: 0;
        }

        .clinic-panel-top-badge {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
            color: #6b7280;
            margin-bottom: 4px;
        }

        #clinic-panel-header-content h2 {
            font-size: 16px;
            font-weight: 700;
            color: #111827;
            margin: 0 0 4px 0;
            line-height: 1.2;
        }

        .clinic-panel-address {
            font-size: 12px;
            color: #4b5563;
            line-height: 1.3;
        }

        .clinic-panel-close-btn {
            background: #f3f4f6;
            border: none;
            color: #4b5563;
            cursor: pointer;
            font-size: 14px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .clinic-panel-close-btn:hover {
            background: #e5e7eb;
            color: #111827;
        }

        /* === Content Area === */
        #clinic-panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            background: #ffffff;
        }

        /* Extensions Banner */
        .extensions-banner {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            color: #1e40af;
            background: #eff6ff;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 14px;
            border: 1px solid #dbeafe;
        }

        /* Department Blocks */
        .clinic-department-block {
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f3f4f6;
        }
        .clinic-department-block:last-child {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        .clinic-department-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .clinic-department-title {
            font-size: 13px;
            font-weight: 700;
            color: #1e3a8a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .clinic-department-phone {
            font-size: 12px;
            font-weight: 600;
            color: #2563eb;
            text-decoration: none;
        }

        .clinic-sub-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 3px 0;
        }

        .clinic-sub-label {
            font-weight: 700;
            color: #4b5563;
            letter-spacing: 0.5px;
            width: 50px;
            flex-shrink: 0;
        }

        .clinic-sub-value {
            color: #1f2937;
            text-align: right;
            word-break: break-word;
            flex: 1;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 11.5px;
        }
    </style>
</head>
<body>

    <!-- Search Bar -->
    <div id="search-container">
        <input type="text" id="searchInput" placeholder="Buscar dirección o Plus Code..." onkeydown="if(event.key === 'Enter') findNearest();" />
        <button onclick="findNearest()">Buscar</button>
        <button onclick="clearSearch()" title="Limpiar">✕</button>
    </div>

    <!-- Map Container -->
    <div id="map-section">
        <div id="map"></div>
    </div>

    <!-- Clinic Details Panel -->
    <div id="clinic-details-panel">
        <div id="clinic-panel-header">
            <div id="clinic-panel-header-content">
                <div class="clinic-panel-top-badge">Selected Clinic</div>
                <h2 id="clinic-panel-name"></h2>
                <div class="clinic-panel-address" id="clinic-panel-address"></div>
            </div>
            <button class="clinic-panel-close-btn" onclick="clearSearch()">✕</button>
        </div>
        <div id="clinic-panel-content"></div>
    </div>

    <!-- Leaflet Script -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Map Logic Script -->
    <script src="map.js"></script>
    
    <script>
        'use strict';

        let currentClinic = null;
        const panel = document.getElementById('clinic-details-panel');

        // === BRIDGE HOOK FOR map.js ===
        window.selectClinicPanel = function(clinic) {
            if (!clinic) {
                closeClinicPanel();
                return;
            }
            currentClinic = clinic;
            displayClinicDetails(clinic);
        };

        // === RENDER CLINIC DETAILS MAPPING SECTIONS DYNAMICALLY ===
        function displayClinicDetails(clinic) {
            if (!clinic) {
                closeClinicPanel();
                return;
            }

            document.getElementById('clinic-panel-name').textContent = clinic.name || 'Sin nombre';
            document.getElementById('clinic-panel-address').textContent = clinic.address || '';

            let contentHtml = `
                <div class="extensions-banner">
                    <span>📞</span> EXTENSIONS & LINES
                </div>
            `;

            const sections = clinic.sections || {};
            const sectionKeys = Object.keys(sections);

            if (sectionKeys.length === 0) {
                contentHtml += `<div style="font-size: 12px; color: #6b7280; text-align: center; padding: 10px;">No hay extensiones disponibles para esta clínica.</div>`;
            } else {
                for (const key of sectionKeys) {
                    const sec = sections[key];
                    const displayName = key.charAt(0).toUpperCase() + key.slice(1);

                    contentHtml += `
                        <div class="clinic-department-block">
                            <div class="clinic-department-header">
                                <span class="clinic-department-title">🔹 ${escapeHtml(displayName)}</span>
                                ${sec.phone ? `<span class="clinic-department-phone">${escapeHtml(sec.phone)}</span>` : ''}
                            </div>
                            ${sec.front ? `<div class="clinic-sub-row"><span class="clinic-sub-label">FRONT</span><span class="clinic-sub-value">${escapeHtml(sec.front)}</span></div>` : ''}
                            ${sec.back ? `<div class="clinic-sub-row"><span class="clinic-sub-label">BACK</span><span class="clinic-sub-value">${escapeHtml(sec.back)}</span></div>` : ''}
                            ${sec.ext ? `<div class="clinic-sub-row"><span class="clinic-sub-label">EXT</span><span class="clinic-sub-value">${escapeHtml(sec.ext)}</span></div>` : ''}
                            ${sec.fax ? `<div class="clinic-sub-row"><span class="clinic-sub-label">FAX</span><span class="clinic-sub-value">${escapeHtml(sec.fax)}</span></div>` : ''}
                        </div>
                    `;
                }
            }

            document.getElementById('clinic-panel-content').innerHTML = contentHtml;
            panel.classList.add('visible');
        }

        // === CLOSE / HIDE PANEL ===
        function closeClinicPanel() {
            panel.classList.remove('visible');
            currentClinic = null;
        }

        // === XSS SANITIZER ===
        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        // === IFRAME POSTMESSAGE LISTENER ===
        window.addEventListener('message', (event) => {
            try {
                const data = event.data;
                if (!data || typeof data !== 'object') return;

                if (data.type === 'CLINIC_SELECTED') {
                    window.selectClinicPanel(data.clinic);
                } else if (data.type === 'CLINIC_DESELECTED') {
                    closeClinicPanel();
                }
            } catch (error) {
                console.error('Error handling message:', error);
            }
        });
    </script>
</body>
</html>
