<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Clinic Map Locator</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Unified Stylesheet -->
    <link rel="stylesheet" href="map.css">
    <style>
        /* === Fixed Right-Side Vertically Centered Panel Override === */
        #clinic-details-panel {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            width: 380px;
            max-height: 85vh;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            overflow: hidden;
        }

        #clinic-details-panel.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%);
            display: flex;
        }

        #clinic-panel-header {
            padding: 14px 16px;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: white;
            border-bottom: 1px solid #0f172a;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #clinic-panel-header-content {
            flex: 1;
        }

        #clinic-panel-header h2 {
            font-size: 16px;
            font-weight: 700;
            margin: 0 0 2px 0;
        }

        .clinic-panel-location-sub {
            font-size: 12px;
            opacity: 0.85;
            font-weight: 400;
        }

        .clinic-panel-close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .clinic-panel-close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        #clinic-panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
        }

        /* Structured data items */
        .clinic-info-section {
            margin-bottom: 14px;
        }
        .clinic-info-section:last-child {
            margin-bottom: 0;
        }
        .clinic-info-title {
            font-size: 13px;
            font-weight: 700;
            color: #1e293b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 4px;
        }
        .clinic-data-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 4px 0;
            color: #334155;
            border-bottom: 1px dashed #f1f5f9;
        }
        .clinic-data-row:last-child {
            border-bottom: none;
        }
        .clinic-data-label {
            color: #64748b;
            font-weight: 500;
        }
        .clinic-data-val {
            font-weight: 600;
            color: #0f172a;
        }
    </style>
</head>
<body>

    <!-- Search Bar -->
    <div id="search-container">
        <input type="text" id="searchInput" placeholder="Buscar dirección o Plus Code..." onkeydown="if(event.key === 'Enter') findNearest();" />
        <button onclick="findNearest()">Buscar</button>
        <button onclick="clearSearch()" title="Limpiar">✕</button>
    </div>

    <!-- Map Container -->
    <div id="map-section">
        <div id="map"></div>
    </div>

    <!-- Clinic Details Panel -->
    <div id="clinic-details-panel">
        <div id="clinic-panel-header">
            <div id="clinic-panel-header-content">
                <h2 id="clinic-panel-name"></h2>
                <div class="clinic-panel-location-sub" id="clinic-panel-location"></div>
            </div>
            <button class="clinic-panel-close-btn" onclick="clearSearch()">✕</button>
        </div>
        <div id="clinic-panel-content"></div>
    </div>

    <!-- Leaflet Script -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Map Logic Script -->
    <script src="map.js"></script>
    
    <script>
        'use strict';

        let currentClinic = null;
        const panel = document.getElementById('clinic-details-panel');

        // === BRIDGE HOOK FOR map.js ===
        window.selectClinicPanel = function(clinic) {
            if (!clinic) {
                closeClinicPanel();
                return;
            }
            currentClinic = clinic;
            displayClinicDetails(clinic);
        };

        // === RENDER CLINIC DETAILS MATCHING THE EXACT SCHEMA ===
        function displayClinicDetails(clinic) {
            if (!clinic) {
                closeClinicPanel();
                return;
            }

            document.getElementById('clinic-panel-name').textContent = escapeHtml(clinic.name || 'Sin nombre');
            
            // Format city, state, zip cleanly in the header sub-text
            const cityStateZip = [clinic.city, clinic.state, clinic.zip].filter(Boolean).join(', ');
            document.getElementById('clinic-panel-location').textContent = cityStateZip;

            let contentHtml = '';

            // 1. Address Section
            if (clinic.address || cityStateZip) {
                contentHtml += `
                    <div class="clinic-info-section">
                        <div class="clinic-info-title">📍 Ubicación</div>
                        ${clinic.address ? `<div class="clinic-data-row"><span class="clinic-data-label">Dirección</span><span class="clinic-data-val">${escapeHtml(clinic.address)}</span></div>` : ''}
                        ${clinic.city ? `<div class="clinic-data-row"><span class="clinic-data-label">Ciudad</span><span class="clinic-data-val">${escapeHtml(clinic.city)}</span></div>` : ''}
                        ${clinic.state ? `<div class="clinic-data-row"><span class="clinic-data-label">Estado</span><span class="clinic-data-val">${escapeHtml(clinic.state)}</span></div>` : ''}
                        ${clinic.zip ? `<div class="clinic-data-row"><span class="clinic-data-label">ZIP</span><span class="clinic-data-val">${escapeHtml(clinic.zip)}</span></div>` : ''}
                    </div>
                `;
            }

            // 2. Medical Section
            if (clinic.medical) {
                const med = clinic.medical;
                contentHtml += `
                    <div class="clinic-info-section">
                        <div class="clinic-info-title">🩺 Medical</div>
                        ${med.front ? `<div class="clinic-data-row"><span class="clinic-data-label">Front</span><span class="clinic-data-val">${escapeHtml(med.front)}</span></div>` : ''}
                        ${med.back ? `<div class="clinic-data-row"><span class="clinic-data-label">Back</span><span class="clinic-data-val">${escapeHtml(med.back)}</span></div>` : ''}
                        ${med.phone ? `<div class="clinic-data-row"><span class="clinic-data-label">Teléfono</span><span class="clinic-data-val">${escapeHtml(med.phone)}</span></div>` : ''}
                        ${med.fax ? `<div class="clinic-data-row"><span class="clinic-data-label">Fax</span><span class="clinic-data-val">${escapeHtml(med.fax)}</span></div>` : ''}
                    </div>
                `;
            }

            // 3. Optical Section
            if (clinic.optical) {
                const opt = clinic.optical;
                contentHtml += `
                    <div class="clinic-info-section">
                        <div class="clinic-info-title">👓 Optical</div>
                        ${opt.ext ? `<div class="clinic-data-row"><span class="clinic-data-label">Ext</span><span class="clinic-data-val">${escapeHtml(opt.ext)}</span></div>` : ''}
                        ${opt.phone ? `<div class="clinic-data-row"><span class="clinic-data-label">Teléfono</span><span class="clinic-data-val">${escapeHtml(opt.phone)}</span></div>` : ''}
                    </div>
                `;
            }

            // 4. Dental Section
            if (clinic.dental) {
                const den = clinic.dental;
                contentHtml += `
                    <div class="clinic-info-section">
                        <div class="clinic-info-title">🦷 Dental</div>
                        ${den.ext ? `<div class="clinic-data-row"><span class="clinic-data-label">Ext</span><span class="clinic-data-val">${escapeHtml(den.ext)}</span></div>` : ''}
                        ${den.phone ? `<div class="clinic-data-row"><span class="clinic-data-label">Teléfono</span><span class="clinic-data-val">${escapeHtml(den.phone)}</span></div>` : ''}
                    </div>
                `;
            }

            // 5. Mental Health (MH) Section
            if (clinic.mh) {
                const mh = clinic.mh;
                contentHtml += `
                    <div class="clinic-info-section">
                        <div class="clinic-info-title">🧠 Mental Health (MH)</div>
                        ${mh.ext ? `<div class="clinic-data-row"><span class="clinic-data-label">Ext</span><span class="clinic-data-val">${escapeHtml(mh.ext)}</span></div>` : ''}
                        ${mh.phone ? `<div class="clinic-data-row"><span class="clinic-data-label">Teléfono</span><span class="clinic-data-val">${escapeHtml(mh.phone)}</span></div>` : ''}
                    </div>
                `;
            }

            document.getElementById('clinic-panel-content').innerHTML = contentHtml;
            panel.classList.add('visible');
        }

        // === CLOSE / HIDE PANEL ===
        function closeClinicPanel() {
            panel.classList.remove('visible');
            currentClinic = null;
        }

        // === XSS SANITIZER ===
        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        // === IFRAME POSTMESSAGE LISTENER ===
        window.addEventListener('message', (event) => {
            try {
                const data = event.data;
                if (!data || typeof data !== 'object') return;

                if (data.type === 'CLINIC_SELECTED') {
                    window.selectClinicPanel(data.clinic);
                } else if (data.type === 'CLINIC_DESELECTED') {
                    closeClinicPanel();
                }
            } catch (error) {
                console.error('Error handling message:', error);
            }
        });
    </script>
</body>
</html>
