<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Clinic Map Locator</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Unified Stylesheet -->
    <link rel="stylesheet" href="map.css">
    <style>
        /* === Fixed Right-Side Vertically Centered Panel === */
        #clinic-details-panel {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            width: 360px;
            max-height: 85vh;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #clinic-details-panel.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%);
            display: flex;
        }

        #clinic-panel-header {
            padding: 14px 16px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-shrink: 0;
        }

        .clinic-panel-top-badge {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
            color: #6b7280;
            margin-bottom: 4px;
        }

        #clinic-panel-header-content h2 {
            font-size: 16px;
            font-weight: 700;
            color: #111827;
            margin: 0 0 4px 0;
            line-height: 1.2;
        }

        .clinic-panel-address {
            font-size: 12px;
            color: #4b5563;
            line-height: 1.3;
        }

        .clinic-panel-close-btn {
            background: #f3f4f6;
            border: none;
            color: #4b5563;
            cursor: pointer;
            font-size: 14px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .clinic-panel-close-btn:hover {
            background: #e5e7eb;
            color: #111827;
        }

        #clinic-panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            background: #ffffff;
        }

        .extensions-banner {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            color: #1e40af;
            background: #eff6ff;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 14px;
            border: 1px solid #dbeafe;
        }

        .clinic-department-block {
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f3f4f6;
        }
        .clinic-department-block:last-child {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        .clinic-department-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .clinic-department-title {
            font-size: 13px;
            font-weight: 700;
            color: #1e3a8a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .clinic-department-phone {
            font-size: 12px;
            font-weight: 600;
            color: #2563eb;
            text-decoration: none;
        }

        .clinic-sub-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 3px 0;
        }

        .clinic-sub-label {
            font-weight: 700;
            color: #4b5563;
            letter-spacing: 0.5px;
            width: 50px;
            flex-shrink: 0;
        }

        .clinic-sub-value {
            color: #1f2937;
            text-align: right;
            word-break: break-word;
            flex: 1;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 11.5px;
        }
    </style>
</head>
<body>

    <!-- Search Bar -->
    <div id="search-container">
        <input type="text" id="searchInput" placeholder="Buscar dirección..." />
        <button onclick="findNearest()">Buscar</button>
        <button onclick="clearSearch()" title="Limpiar">✕</button>
    </div>

    <!-- Map Container -->
    <div id="map-section">
        <div id="map"></div>
    </div>

    <!-- Clinic Details Panel (Excludes code & plusCode entirely) -->
    <div id="clinic-details-panel">
        <div id="clinic-panel-header">
            <div id="clinic-panel-header-content">
                <div class="clinic-panel-top-badge">Selected Clinic</div>
                <h2 id="clinic-panel-name"></h2>
                <div class="clinic-panel-address" id="clinic-panel-address"></div>
            </div>
            <button class="clinic-panel-close-btn" onclick="closeClinicPanel()">✕</button>
        </div>
        <div id="clinic-panel-content"></div>
    </div>

    <!-- Leaflet Script -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Map Logic Script -->
    <script src="map.js"></script>
    
    <script>
        'use strict';

        let currentClinic = null;
        const panel = document.getElementById('clinic-details-panel');

        window.selectClinicPanel = function(clinic) {
            if (!clinic) {
                closeClinicPanel();
                return;
            }
            currentClinic = clinic;
            displayClinicDetails(clinic);
        };

        function displayClinicDetails(clinic) {
            if (!clinic) return;

            document.getElementById('clinic-panel-name').textContent = clinic.name || 'Sin nombre';
            document.getElementById('clinic-panel-address').textContent = clinic.address || '';

            let contentHtml = `
                <div class="extensions-banner">
                    <span>📞</span> EXTENSIONS & LINES
                </div>
            `;

            let hasSections = false;

            // Helper renderer for department blocks
            function renderDept(title, data) {
                if (!data) return;
                const hasData = Object.values(data).some(val => val && val.trim() !== '');
                if (!hasData) return;

                hasSections = true;
                contentHtml += `
                    <div class="clinic-department-block">
                        <div class="clinic-department-header">
                            <span class="clinic-department-title">🔹 ${escapeHtml(title)}</span>
                            ${data.phone ? `<span class="clinic-department-phone">${escapeHtml(data.phone)}</span>` : ''}
                        </div>
                        ${data.front ? `<div class="clinic-sub-row"><span class="clinic-sub-label">FRONT</span><span class="clinic-sub-value">${escapeHtml(data.front)}</span></div>` : ''}
                        ${data.back ? `<div class="clinic-sub-row"><span class="clinic-sub-label">BACK</span><span class="clinic-sub-value">${escapeHtml(data.back)}</span></div>` : ''}
                        ${data.ext ? `<div class="clinic-sub-row"><span class="clinic-sub-label">EXT</span><span class="clinic-sub-value">${escapeHtml(data.ext)}</span></div>` : ''}
                        ${data.fax ? `<div class="clinic-sub-row"><span class="clinic-sub-label">FAX</span><span class="clinic-sub-value">${escapeHtml(data.fax)}</span></div>` : ''}
                    </div>
                `;
            }

            renderDept('Medical', clinic.medical);
            renderDept('Optical', clinic.optical);
            renderDept('Dental', clinic.dental);
            renderDept('Mental Health', clinic.mh);

            if (!hasSections) {
                contentHtml += `<div style="font-size: 12px; color: #6b7280; text-align: center; padding: 10px;">No hay información de extensiones disponible.</div>`;
            }

            document.getElementById('clinic-panel-content').innerHTML = contentHtml;
            panel.classList.add('visible');
        }

        function closeClinicPanel() {
            panel.classList.remove('visible');
            currentClinic = null;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
