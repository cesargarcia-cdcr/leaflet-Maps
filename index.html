<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- 👁️ MONITOR DE FOCO Y VISIBILIDAD (Detecta si la app pasa 20+ min en segundo plano) -->
    <script>
        (function() {
            if (!window._visibilityTrackingInitialized) {
                window._visibilityTrackingInitialized = true;
                let hiddenTimeStart = 0;
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'hidden') {
                        hiddenTimeStart = Date.now();
                    } else if (document.visibilityState === 'visible' && hiddenTimeStart > 0) {
                        const elapsedHidden = Date.now() - hiddenTimeStart;
                        // 20 minutos en milisegundos
                        if (elapsedHidden >= 20 * 60 * 1000) {
                            localStorage.setItem('app_lost_focus_long', 'true');
                        }
                        hiddenTimeStart = 0;
                    }
                });
            }
        })();
    </script>

    <!-- 🛡️ BLOQUEADOR CRÍTICO DE SESIÓN -->
    <script>
        (function() {
            try {
                const sessionLocked = 
                    (window.LSEngine && window.LSEngine.isLocked) || 
                    window.location.search.includes('login_required') ||
                    localStorage.getItem("session_expired") === "true";

                if (sessionLocked) {
                    document.documentElement.innerHTML = `
                        <head>
                            <title>Authentication Required</title>
                            <style>
                                body { background: #0f172a; color: #94a3b8; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
                                .box { text-align: center; padding: 2rem; background: #1e293b; border-radius: 8px; border: 1px solid #334155; }
                                h2 { color: #38bdf8; margin-top: 0; }
                            </style>
                        </head>
                        <body>
                            <div class="box">
                                <h2>🔒 Sesión Requerida</h2>
                                <p>No hay una sesión activa o la autenticación ha expirado.</p>
                                <p style="font-size: 12px; color: #64748b;">Por favor, complete el inicio de sesión para continuar.</p>
                            </div>
                        </body>
                    `;
                    throw new Error("Acceso denegado: Se requiere sesión activa.");
                }
            } catch (e) {
                if (e.message !== "Acceso denegado: Se requiere sesión activa.") {
                    console.error("Error en bloqueo de seguridad:", e);
                }
            }
        })();
    </script>

    <!-- ⚙️ VALIDACIÓN DE ACTUALIZACIÓN (4 Horas + 20 min sin foco) -->
    <script>
        (function() {
            try {
                const lastTimestamp = parseInt(localStorage.getItem("app_last_sync_timestamp") || "0", 10);
                const hasPayload = localStorage.getItem("cache_payload");
                const hasLitePayloadCache = localStorage.getItem("lite_payload_cache");
                
                // 🕒 Umbral de 4 horas
                const FOUR_HOURS_MS = 4 * 60 * 60 * 1000;
                const isOlderThan4Hours = (Date.now() - lastTimestamp) >= FOUR_HOURS_MS;
                const lostFocusLong = localStorage.getItem("app_lost_focus_long") === "true";

                const todayStr = new Date().toISOString().split("T")[0];
                const lastSyncDate = localStorage.getItem("app_last_sync_date");

                // Condición: Falta info base O (Tiene >= 4 horas de antigüedad Y perdió foco por 20+ min)
                const needsSync = !lastSyncDate || lastSyncDate !== todayStr || !hasPayload || !hasLitePayloadCache || (isOlderThan4Hours && lostFocusLong);

                if (needsSync) {
                    const currentPath = window.location.pathname;
                    if (!currentPath.includes('loading-screen')) {
                        const fastParam = hasLitePayloadCache ? '&fast=1' : '';
                        const targetSearch = window.location.search 
                            ? window.location.search + fastParam 
                            : (hasLitePayloadCache ? '?fast=1' : '');

                        window.location.replace('loading-screen.html' + targetSearch);
                    }
                } else {
                    // Si no necesita sincronización, limpiamos la bandera de pérdida de foco temporal
                    localStorage.removeItem("app_lost_focus_long");

                    // Ocultamos el splash de carga inmediatamente
                    const style = document.createElement('style');
                    style.innerHTML = '#sync-splash { display: none !important; opacity: 0 !important; pointer-events: none !important; }';
                    document.head.appendChild(style);
                }
            } catch (e) {
                console.error("Error en validación de sync:", e);
            }
        })();
    </script>

<body>
    <div class="app-container">
        <button class="burger" onclick="toggleMenu()"><span></span><span></span><span></span></button>
        <div class="sidebar-overlay" onclick="toggleMenu()"></div>
        
        <aside class="sidebar">
            <nav style="display:flex; flex-direction:column; height:100%;">

                <div class="nav-item" onclick="navigateTo('map')">Map</div>
                <div class="nav-item" onclick="navigateTo('directory')">Clinic Directory</div>
                <div class="nav-item" onclick="navigateTo('provider-directory')">Provider Directory</div>
                <div class="nav-item" onclick="navigateTo('info')">Guidelines & Info</div>

                <div style="margin-top:auto;">

                        🔄 Sync Data

                </div>
            </nav>
        </aside>

        <div class="page">
            <header class="brand">
            </header>

            <section class="card" id="note-section">
                <div class="card-hd">
                    <h3>📝 Appointment Note Builder</h3>
                    <div class="actions">
                        <button class="btn ghost" onclick="resetForm()">↺ Reset</button>
                        <button class="btn primary" onclick="copyResult()">📋 Copy Note</button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="two-col">
                        <div class="form-group">
                            <label>Symptoms / Chief Complaint</label>
                            <input id="n1" placeholder="e.g., cough, sore throat, fever" oninput="updateNote()" />
                        </div>
                        <div class="form-group">
                            <label>Visit Type</label>
                            <input id="n2" placeholder="Emergent/Routine (defaults to 'no E/R')" oninput="updateNote()" />
                        </div>
                    </div>
                    <div class="two-col">
                        <div class="form-group">
                            <label>Insurance Type</label>
                            <select id="n3" onchange="updateNote()">
                                <option value="">-- Select Insurance --</option>
                                <option>Gold Coast</option>
                                <option>Medi-Cal</option>
                                <option>Medicare</option>
                                <option>PPO</option>
                                <option>Self-Pay</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Member ID</label>
                            <input id="n4" placeholder="Insurance member ID" oninput="updateNote()" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Additional Notes</label>
                        <textarea id="n5" rows="2" placeholder="Allergies, transportation needs, preferred callback times..." oninput="updateNote()"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Generated Note (Copy-Ready Format)</label>
                        <div id="result" class="note-result"></div>
                    </div>
                </div>
            </section>

            <section id="map-section" class="map-full" style="display:none">
                <div id="map" class="map-viewport"></div>
                <div class="map-controls">
                    <div class="mc-row">
                        <div class="mc-card">
                            <div class="mc-line mc-search">
                                <input id="searchInput" class="mc-input" list="clinicNameList" placeholder="Address, ZIP, code, nickname, or clinic name" />
                                <datalist id="clinicNameList"></datalist>
                                <button class="btn primary" onclick="findNearest()">🔎 Find</button>
                                <button class="btn ghost" onclick="clearSearch()">✕ Clear</button>
                            </div>
                        </div>
                        <div class="mc-fab-col">
                            <button class="mc-fab" title="Recenter" onclick="window.AppMap?.invalidate()">⤢</button>
                        </div>
                    </div>
                </div>
                <aside id="place-sheet" class="sheet" aria-hidden="true">
                    <div class="sheet-hd">
                        <div class="sheet-title">Selected Clinic</div>
                        <button class="sheet-close" title="Close" onclick="window.closePlaceSheet?.()">✕</button>
                    </div>
                    <div class="sheet-body" id="clinic-info-body">
                        <div class="empty-state">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                            <div>Click a clinic marker or use search.</div>
                        </div>
                    </div>
                </aside>
            </section>

            <section class="card" id="directory-section" style="display:none">
                <div class="card-hd dir-sticky-hd" id="dirStickyHd">
                    <h3>📘 Directory (CSV)</h3>
                    <div class="actions">
                        <div class="search-wrapper" style="display:flex; gap:8px; flex-wrap:wrap;">
                            <select id="dirClinicSelect" class="dir-select" title="Filter by clinic">
                                <option value="">All clinics</option>
                            </select>
                            <input id="dirSearchCSV" placeholder="Search name, department, ext, phone..." oninput="CSVDir_filter()" />
                        </div>
                        <button class="btn ghost" onclick="CSVDir_reset()">✕ Clear</button>
                    </div>
                </div>
                <div class="card-body">
                    <div id="csvdir-meta" class="csvdir-meta"></div>
                    <div id="csvdir-root" class="csvdir-root"></div>
                    <div id="csvdir-empty" class="csvdir-empty">No matches found.</div>
                </div>
            </section>

            <section class="card" id="provider-directory-section" style="display:none">
                <div class="card-hd dir-sticky-hd">
                    <h3>👨‍⚕️ Provider Lookup</h3>
                    <div class="actions">
                        <input id="masterProviderSearch" placeholder="Search provider name, internal ID, NPI, or specialty..." style="width: 280px;" />
                    </div>
                </div>
                <div class="card-body">
                    <div id="masterProviderGrid" class="info-grid">
                    
                    </div>
                </div>
            </section>

            <section class="card" id="info-section" style="display:none; padding: 4px;">
                <div class="card-hd" style="padding: 6px 10px;">
                    <h3 style="font-size: 0.85rem; margin: 0;">📋 Guidelines & Info </h3>
                </div>
                <div class="card-body" style="padding: 4px; display: flex; flex-direction: column; gap: 6px;">
                    
                </div>
            </section>
        </div>
    </div>

    <div class="toast" id="toast">✓ Copied to clipboard!</div>

    <script>
        window.APP_DATA = window.APP_DATA || {};
        window.APP_FILES = window.APP_FILES || {};

        window.registerDataFile = function(config, data) {
            if (!window.APP_FILES[config.file]) {
                window.APP_FILES[config.file] = config;
            }
            window.APP_DATA[config.dataKey] = data;
            console.log("📁 Registered:", config.file);
        };
    </script>

    <!-- 🚀 LLAMADA MANUAL DEL MAPA AL CARGAR LA PÁGINA (Evita pantalla en blanco si no hubo redirección) -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            console.log("⚡ [Index] Verificación completada. Asegurando inicialización de componentes...");
            
            // Si estás utilizando la función manual que definimos antes (ej. initManualMap):
            if (typeof window.initManualMap === 'function') {
                window.initManualMap();
            } 
            // O si sigues usando map.js con eventos automáticos, aseguramos un disparador de respaldo:
            else if (typeof window.obtenerCsv === 'function' || localStorage.getItem("cache_payload")) {
                setTimeout(() => {
                    window.dispatchEvent(new Event('AppDataLoaded'));
                }, 100);
            }
        });
    </script>

    <script>
        function openModal(id) {
            var modal = document.getElementById(id);
            var overlay = document.getElementById('overlay');
            if (modal && overlay) {
                modal.style.display = 'block';
                overlay.style.display = 'block';
            }
        }

        function closeAll() {
            var modals = document.getElementsByClassName('modal');
            for (var i = 0; i < modals.length; i++) {
                modals[i].style.display = 'none';
            }
            var overlay = document.getElementById('overlay');
            if (overlay) {
                overlay.style.display = 'none';
            }
        }
    </script>
</body>
</html>
