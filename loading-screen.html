<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script src="theme.js"></script>
    <link rel="stylesheet" href="loading-screen.css">
    <link rel="stylesheet" href="theme.css">
    <head>
    <meta charset="UTF-8" />
    
    <!-- 🛡️ BLOQUEADOR CRÍTICO DE SESIÓN (Debe ir al inicio absoluto del <head>) -->
    <script>
        (function() {
            try {
                // Evalúa tus condiciones de bloqueo (bandera global, parámetros de URL o estado de sesión)
                const sessionLocked = 
                    (window.LSEngine && window.LSEngine.isLocked) || 
                    window.location.search.includes('login_required') ||
                    localStorage.getItem("session_expired") === "true";

                if (sessionLocked) {
                    // Opción A: Vaciar el HTML y mostrar una pantalla limpia de bloqueo
                    document.documentElement.innerHTML = `
                        <head>
                            <title>Authentication Required</title>
                            <link rel="stylesheet" href="loading-screen.css">
                            <link rel="stylesheet" href="theme.css">
                        </head>
                        <body class="loading-auth-page">
                            <div class="box">
                                <h2>🔒 Sesión Requerida</h2>
                                <p>No hay una sesión activa o la autenticación ha expirado.</p>
                                <p class="loading-auth-note">Por favor, complete el inicio de sesión para continuar.</p>
                            </div>
                        </body>
                    `;
                    
                    // Detiene por completo la ejecución del resto del script de la página
                    throw new Error("Acceso denegado: Se requiere sesión activa.");
                }
            } catch (e) {
                // Silencia el error intencional de interrupción para que no ensucie la consola de forma crítica
                if (e.message !== "Acceso denegado: Se requiere sesión activa.") {
                    console.error("Error en bloqueo de seguridad:", e);
                }
            }
        })();
    </script>

    <!-- El resto de tus meta tags, hojas de estilo (leaflet, app.css, etc.) van aquí abajo... -->
    <script>
        // Forzar recarga completa desde el servidor (equivalente a recarga dura)
    function hardReloadApp() {
        // Si agregas un parámetro aleatorio, forzarás al navegador a buscar el HTML fresco
        const currentUrl = window.location.href.split('?')[0];
        const searchParams = window.location.search;
        
        // Añade o actualiza un timestamp de versión para romper la caché del navegador
        const cacheBuster = `_cb=${Date.now()}`;
        
        let newUrl = currentUrl;
        if (searchParams) {
            // Reemplaza o añade el parámetro de control
            if (searchParams.includes('_cb=')) {
                newUrl += searchParams.replace(/_cb=\d+/, cacheBuster);
            } else {
                newUrl += `${searchParams}&${cacheBuster}`;
            }
        } else {
            newUrl += `?${cacheBuster}`;
        }
        
        window.location.replace(newUrl);
    }
    </script>
    <title>System Loading - Interactive Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="notes.css">
    <link rel="stylesheet" href="map.css">
    <link rel="stylesheet" href="block-F12.css">
</head>
<body class="loading-page">

    <div id="app-frame-wrapper">
        <div id="map-area">
            <div id="map"></div>

            <aside id="place-sheet" class="sheet" aria-hidden="true">
                <div class="sheet-hd">
                    <div class="sheet-title">Selected Clinic</div>
                    <button class="sheet-close" title="Close" onclick="closeSheet()">✕</button>
                </div>
                <div class="sheet-body" id="clinic-info-body">
                    <div class="loading-empty-state">
                        <svg class="loading-empty-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                        <div>Click on a map marker or select a clinic from the map dropdown menu.</div>
                    </div>
                </div>
            </aside>
        </div>

        <div id="sync-footer-panel">
            <div class="loading-status-row">
                <p id="sync-status" class="loading-status-text">Waiting to orchestrate sync...</p>
                <span class="loading-state-label">STATUS: <span id="bt-state-text" class="loading-state-value">IDLE</span></span>
            </div>
            <div class="bt-progress-container">
                <div id="bt-progress-bar" class="bt-progress-fill"></div>
            </div>
            <div class="loading-progress-label">
                <span id="bt-percentage">0%</span>
            </div>
        </div>
    </div>

    <!-- Carga de la librería del mapa -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Scripts independientes listos para ser controlados -->
    <script src="loading-screen-W-LOGS.js"></script>
    <script src="map-lite.js"></script>
    <script src="block-F12.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', async () => {
    try {
        console.log("🚀 [LSEngine] Iniciando secuencia de carga...");
        
        const urlParams = new URLSearchParams(window.location.search);
        const isFastMode = urlParams.get('fast') === '1' || localStorage.getItem("lite_payload_cache");

        // 1. Esperamos la decisión de sesión: online o modo offline explícito.
        let sessionActive = true;
        if (typeof red_leader === 'function') {
            sessionActive = await red_leader([0]);
        }

        const offlineMode = window.LSEngine.offlineMode === true
            || sessionStorage.getItem("app_offline_mode") === "true";
        if (offlineMode) {
            console.log("🔓 [LSEngine] Offline mode selected. Loading cached data without contacting Power Automate...");
            await window.GreenLeaderStorage.restoreOfflineData();
            window.LSEngine.initializeMap();
            updateProgress(100, "Offline mode: using locally stored data.", "OFFLINE");
            return;
        }
        if (!sessionActive) return;

        // 2. Condicional limpio según el modo rápido
        if (isFastMode) {
            console.log("⚡ [LSEngine] Modo rápido (?fast=1) activado: Saltando fetch lite y cargando desde OPFS...");
            if (typeof red_leader === 'function') {
                await window.GreenLeaderStorage.restoreCacheFromOPFSToLocalStorage('lite_payload.json');
            }
        } else {
            console.log("🌐 [LSEngine] Ejecutando petición de datos principales (Lite Payload)...");
            await window.LSEngine.taskFetchMainDataLite();
            await window.GreenLeaderStorage.restoreCacheFromOPFSToLocalStorage('lite_payload.json');
        }

        // 3. Pintar el mapa de inmediato
        const mapLoaded = window.LSEngine.initializeMap();

        if (mapLoaded) {
            console.log("📍 Mapa operativo. Procediendo con la sincronización y descarga en segundo plano...");
            
            // 4. Ejecutamos el resto de los procesos pesados usando red_leader (Pasos 2 y 4)
            if (typeof red_leader === 'function') {
                await red_leader([2, 4]);
                await window.GreenLeaderStorage.restoreCacheFromOPFSToLocalStorage(); // 👈 Asegura el mapeo a localStorage y estado global al terminar
            }
        }
    } catch (err) {
        console.error("❌ Error en el flujo principal de LSEngine:", err);
        window.LSEngine.setProgress(100, "Error crítico en el sistema", "ERROR");
    }
});
</script>

</body>
</html>
