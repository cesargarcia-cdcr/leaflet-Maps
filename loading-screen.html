<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script src="iframe-data.js"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="loading-screen.css">
    <link rel="stylesheet" href="theme.css">

    <!-- Add the remaining metadata and stylesheets (Leaflet, app styles, etc.) below. -->
    <script>
        // Force a full reload from the server.
    function hardReloadApp() {
        // Add a random parameter to force the browser to fetch fresh HTML.
        const currentUrl = window.location.href.split('?')[0];
        const searchParams = window.location.search;
        
        // Add or update a version timestamp to bypass the browser cache.
        const cacheBuster = `_cb=${Date.now()}`;
        
        let newUrl = currentUrl;
        if (searchParams) {
            // Replace or add the cache-busting parameter.
            if (searchParams.includes('_cb=')) {
                newUrl += searchParams.replace(/_cb=\d+/, cacheBuster);
            } else {
                newUrl += `${searchParams}&${cacheBuster}`;
            }
        } else {
            newUrl += `?${cacheBuster}`;
        }
        
        window.location.replace(newUrl);
    }
    </script>
    <title>System Loading - Interactive Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="notes.css">
    <link rel="stylesheet" href="map.css">
    <link rel="stylesheet" href="block-F12.css">
</head>
<body class="loading-page">

    <div id="app-frame-wrapper">
        <div id="map-area">
            <div id="map"></div>

            <aside id="place-sheet" class="sheet" aria-hidden="true">
                <div class="sheet-hd">
                    <div class="sheet-title">Selected Clinic</div>
                    <button class="sheet-close" title="Close" onclick="closeSheet()">✕</button>
                </div>
                <div class="sheet-body" id="clinic-info-body">
                    <div class="loading-empty-state">
                        <svg class="loading-empty-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                        <div>Click on a map marker or select a clinic from the map dropdown menu.</div>
                    </div>
                </div>
            </aside>
        </div>

        <div id="sync-footer-panel">
            <div class="loading-status-row">
                <p id="sync-status" class="loading-status-text">Waiting to orchestrate sync...</p>
                <span class="loading-state-label">STATUS: <span id="bt-state-text" class="loading-state-value">IDLE</span></span>
            </div>
            <div class="bt-progress-container">
                <div id="bt-progress-bar" class="bt-progress-fill"></div>
            </div>
            <div class="loading-progress-label">
                <span id="bt-percentage">0%</span>
            </div>
        </div>
    </div>

    <!-- Load the map library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Independent scripts, ready to be orchestrated -->
    <script src="loading-screen-W-LOGS.js"></script>
    <script src="map-lite.js"></script>
    <script src="block-F12.js"></script>

    <script>
    async function waitForIFrameSharedFiles(timeoutMs = 30000) {
        let timeoutId;
        try {
            return await Promise.race([
                window.IFrameVirtualPCFDataReady,
                new Promise((_, reject) => {
                    timeoutId = setTimeout(
                        () => reject(new Error("Timed out waiting for the iframe-shared cache_payload.json.")),
                        timeoutMs
                    );
                })
            ]);
        } finally {
            clearTimeout(timeoutId);
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
    try {
        console.log("🚀 [LSEngine] Starting the loading sequence...");
        
        const urlParams = new URLSearchParams(window.location.search);
            const iframeShareMode = urlParams.get("iframeShare") === "1";
        const isFastMode = urlParams.get('fast') === '1' || localStorage.getItem("lite_payload_cache");

            if (iframeShareMode) {
                updateProgress(10, "Waiting for shared application data...", "RECEIVING");
                const sharedFiles = await waitForIFrameSharedFiles();
                await window.GreenLeaderStorage.importIFrameSharedFiles(sharedFiles);
            }

        const offlineMode = window.LSEngine.offlineMode === true
            || sessionStorage.getItem("app_offline_mode") === "true";
        let usedCachedFallback = false;
        if (offlineMode) {
            console.log("🔓 [LSEngine] Offline mode selected. Loading cached data without contacting Power Automate...");
            const restored = await window.GreenLeaderStorage.restoreOfflineData();
            if (!restored) throw new Error("No usable offline payload was found in the local cache.");
            window.LSEngine.initializeMap();
            updateProgress(100, "Offline mode: using locally stored data.", "OFFLINE");
            return;
        }
        // 2. Choose the regular lite-payload path; iframe sharing replaces only the full payload request.
        if (isFastMode) {
            console.log("⚡ [LSEngine] Fast mode (?fast=1) is enabled. Skipping the lite fetch and loading from OPFS...");
            let litePayloadRestored = await window.GreenLeaderStorage.restoreCacheFromOPFSToLocalStorage('lite_payload.json');
            if (!litePayloadRestored) {
                litePayloadRestored = await window.GreenLeaderStorage.restoreCacheFromOPFSToLocalStorage('cache_payload.json');
                usedCachedFallback = litePayloadRestored;
            }
            if (!litePayloadRestored) {
                console.warn("⚠️ [LSEngine] Lite payload cache is missing. Downloading it now...");
                try {
                    await window.LSEngine.taskFetchMainDataLite();
                    litePayloadRestored = await window.GreenLeaderStorage.restoreCacheFromOPFSToLocalStorage('lite_payload.json');
                } catch (downloadError) {
                    console.error("❌ [LSEngine] Lite payload download failed; trying the saved payload.", downloadError);
                    litePayloadRestored = await window.GreenLeaderStorage.restoreOfflineData();
                    usedCachedFallback = litePayloadRestored;
                    if (!litePayloadRestored) throw downloadError;
                }
            }
            if (!litePayloadRestored) {
                litePayloadRestored = await window.GreenLeaderStorage.restoreOfflineData();
                usedCachedFallback = litePayloadRestored;
            }
            if (!litePayloadRestored) {
                throw new Error("No usable lite or full payload could be loaded from cache or download.");
            }
        } else {
            console.log("🌐 [LSEngine] Fetching the main data payload (lite)...");
            try {
                await window.LSEngine.taskFetchMainDataLite();
                let payloadRestored = await window.GreenLeaderStorage.restoreCacheFromOPFSToLocalStorage('lite_payload.json');
                if (!payloadRestored) {
                    payloadRestored = await window.GreenLeaderStorage.restoreCacheFromOPFSToLocalStorage('cache_payload.json');
                    usedCachedFallback = payloadRestored;
                }
                if (!payloadRestored) throw new Error("The downloaded payload could not be restored.");
            } catch (downloadError) {
                console.error("❌ [LSEngine] Lite payload download failed; trying the saved payload.", downloadError);
                usedCachedFallback = await window.GreenLeaderStorage.restoreOfflineData();
                if (!usedCachedFallback) throw downloadError;
            }
        }

        if (iframeShareMode) {
            const sharedPayloadRestored = await window.GreenLeaderStorage.restoreCacheFromOPFSToLocalStorage("cache_payload.json");
            if (!sharedPayloadRestored) {
                throw new Error("The iframe-shared cache_payload.json could not be restored.");
            }
        }

        if (usedCachedFallback) {
            updateProgress(100, "Using saved data; synchronization skipped.", "READY");
        }

        // 3. Render the map immediately.
        const mapLoaded = window.LSEngine.initializeMap();

        if (mapLoaded) {
            console.log("📍 Map is ready. Starting background synchronization and downloads...");
            
            // 4. Run the remaining heavy tasks through red_leader (steps 2 and 4).
            if (typeof red_leader === 'function') {
                await red_leader(usedCachedFallback ? [4] : [2, 4]);
                if (!usedCachedFallback) {
                    await window.GreenLeaderStorage.restoreCacheFromOPFSToLocalStorage(); // Ensure localStorage and global state are updated.
                }
            }
        }
    } catch (err) {
        console.error("❌ Error in the main LSEngine flow:", err);
        window.LSEngine.setProgress(100, "Critical system error", "ERROR");
    }
});
</script>

</body>
</html>
