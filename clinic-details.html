<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Details</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: transparent;
        }

        #details-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 350px;
            max-height: 500px;
            display: none;
            flex-direction: column;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            overflow: hidden;
        }

        #details-container.visible {
            display: flex;
        }

        .clinic-header {
            padding: 12px 16px;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: white;
            border-bottom: 1px solid #0f172a;
            flex-shrink: 0;
            cursor: move;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .clinic-header-content {
            flex: 1;
        }

        .clinic-header h2 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .clinic-code {
            font-size: 11px;
            opacity: 0.8;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .clinic-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }

        .info-section {
            margin-bottom: 16px;
        }

        .info-section:last-child {
            margin-bottom: 0;
        }

        .info-section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .address-block {
            background: #f1f5f9;
            padding: 8px;
            border-radius: 4px;
            border-left: 3px solid #2563eb;
            line-height: 1.4;
            color: #334155;
            font-size: 12px;
        }

        .pluscode-item {
            margin-top: 6px;
            font-size: 11px;
            color: #64748b;
        }

        .pluscode-value {
            font-weight: 600;
            color: #2563eb;
            font-family: monospace;
        }

        .section-block {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            padding: 8px;
            margin-bottom: 8px;
        }

        .section-block:last-child {
            margin-bottom: 0;
        }

        .section-block-title {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 6px;
            text-transform: capitalize;
            font-size: 12px;
        }

        .section-detail {
            font-size: 11px;
            color: #475569;
            margin-bottom: 3px;
        }

        .section-detail strong {
            color: #1e293b;
        }

        .contact-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .contact-item {
            flex: 1;
            background: white;
            border: 1px solid #e2e8f0;
            padding: 6px;
            border-radius: 3px;
            text-align: center;
        }

        .contact-label {
            font-weight: 600;
            color: #1e293b;
            font-size: 10px;
        }

        .contact-value {
            color: #2563eb;
            font-weight: 500;
            margin-top: 3px;
            word-break: break-all;
            font-size: 11px;
        }

        /* Scrollbar styling */
        .clinic-content::-webkit-scrollbar {
            width: 4px;
        }

        .clinic-content::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .clinic-content::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 2px;
        }

        .clinic-content::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            #details-container {
                width: 300px;
                bottom: 10px;
                right: 10px;
                max-height: 60vh;
            }

            .clinic-header h2 {
                font-size: 14px;
            }

            .contact-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="details-container">
        <div class="clinic-header" id="drag-handle">
            <div class="clinic-header-content">
                <h2 id="clinic-name"></h2>
                <div class="clinic-code" id="clinic-code"></div>
            </div>
            <button class="close-btn" onclick="closePanel()">✕</button>
        </div>
        <div class="clinic-content" id="clinic-content">
        </div>
    </div>

    <script>
        'use strict';

        let currentClinic = null;
        let isDragging = false;
        let offsetX = 0;
        let offsetY = 0;

        const container = document.getElementById('details-container');
        const dragHandle = document.getElementById('drag-handle');

        /**
         * Make panel draggable
         */
        dragHandle.addEventListener('mousedown', (e) => {
            isDragging = true;
            const rect = container.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                container.style.right = 'auto';
                container.style.bottom = 'auto';
                container.style.left = (e.clientX - offsetX) + 'px';
                container.style.top = (e.clientY - offsetY) + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        /**
         * Listen for messages from the map iframe
         */
        window.addEventListener('message', (event) => {
            try {
                const data = event.data;

                if (data.type === 'CLINIC_SELECTED') {
                    currentClinic = data.clinic;
                    console.log('Clinic selected:', currentClinic);
                    displayClinicDetails(currentClinic);
                } else if (data.type === 'CLINIC_DESELECTED') {
                    currentClinic = null;
                    console.log('Clinic deselected');
                    closePanel();
                }
            } catch (error) {
                console.error('Error handling message:', error);
            }
        });

        /**
         * Display clinic details in the panel
         */
        function displayClinicDetails(clinic) {
            if (!clinic) {
                closePanel();
                return;
            }

            document.getElementById('clinic-name').textContent = escapeHtml(clinic.name || 'Sin nombre');
            document.getElementById('clinic-code').textContent = 'Código: ' + escapeHtml(clinic.code || 'N/A');

            let contentHtml = '';

            // Address section
            if (clinic.address || clinic.plusCode) {
                contentHtml += `
                    <div class="info-section">
                        <div class="info-section-title">📍 Ubicación</div>
                        <div class="address-block">
                            ${clinic.address ? `<div>${escapeHtml(clinic.address)}</div>` : ''}
                            ${clinic.plusCode ? `<div class="pluscode-item">Plus Code: <span class="pluscode-value">${escapeHtml(clinic.plusCode)}</span></div>` : ''}
                        </div>
                    </div>
                `;
            }

            // Departments section
            if (clinic.sections && Object.keys(clinic.sections).length > 0) {
                contentHtml += `<div class="info-section"><div class="info-section-title">🏥 Departamentos</div>`;

                for (const [sectionKey, sectionData] of Object.entries(clinic.sections)) {
                    if (!sectionData) continue;

                    contentHtml += `<div class="section-block">`;
                    contentHtml += `<div class="section-block-title">${escapeHtml(sectionKey)}</div>`;

                    if (sectionData.name) {
                        contentHtml += `<div class="section-detail"><strong>Departamento:</strong> ${escapeHtml(sectionData.name)}</div>`;
                    }

                    // Contact information row
                    const hasPhone = sectionData.phone || false;
                    const hasFax = sectionData.fax || false;

                    if (hasPhone || hasFax) {
                        contentHtml += `<div class="contact-row">`;
                        if (hasPhone) {
                            contentHtml += `
                                <div class="contact-item">
                                    <div class="contact-label">📞 Teléfono</div>
                                    <div class="contact-value">${escapeHtml(sectionData.phone)}</div>
                                </div>
                            `;
                        }
                        if (hasFax) {
                            contentHtml += `
                                <div class="contact-item">
                                    <div class="contact-label">📠 Fax</div>
                                    <div class="contact-value">${escapeHtml(sectionData.fax)}</div>
                                </div>
                            `;
                        }
                        contentHtml += `</div>`;
                    }

                    contentHtml += `</div>`;
                }

                contentHtml += `</div>`;
            }

            document.getElementById('clinic-content').innerHTML = contentHtml;
            container.classList.add('visible');
        }

        /**
         * Close panel
         */
        function closePanel() {
            container.classList.remove('visible');
            currentClinic = null;
        }

        /**
         * Escape HTML special characters
         */
        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        // Notify parent that details panel is ready
        if (window.parent !== window) {
            window.parent.postMessage({
                type: 'CLINIC_DETAILS_READY',
                timestamp: new Date().toISOString()
            }, '*');
        }

        console.log('Clinic Details Panel initialized and listening for messages');
    </script>
</body>
</html>
