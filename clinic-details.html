<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Details</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f8fafc;
        }

        #details-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #94a3b8;
            padding: 20px;
        }

        #empty-state p {
            font-size: 14px;
        }

        .clinic-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
        }

        .clinic-header {
            padding: 16px;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: white;
            border-bottom: 2px solid #0f172a;
            flex-shrink: 0;
        }

        .clinic-header h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .clinic-header .clinic-code {
            font-size: 12px;
            opacity: 0.8;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .clinic-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .info-section {
            margin-bottom: 20px;
        }

        .info-section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .address-block {
            background: #f1f5f9;
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #2563eb;
            line-height: 1.5;
            color: #334155;
            font-size: 13px;
        }

        .section-block {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .section-block-title {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
            text-transform: capitalize;
            font-size: 13px;
        }

        .section-detail {
            font-size: 12px;
            color: #475569;
            margin-bottom: 4px;
        }

        .contact-row {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .contact-item {
            flex: 1;
            background: white;
            border: 1px solid #e2e8f0;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
        }

        .contact-label {
            font-weight: 600;
            color: #1e293b;
            font-size: 11px;
        }

        .contact-value {
            color: #2563eb;
            font-weight: 500;
            margin-top: 4px;
            word-break: break-all;
            font-size: 12px;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #1e293b;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        /* Scrollbar styling */
        .clinic-content::-webkit-scrollbar {
            width: 6px;
        }

        .clinic-content::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .clinic-content::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .clinic-content::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .clinic-header {
                padding: 12px;
            }

            .clinic-header h2 {
                font-size: 16px;
            }

            .clinic-content {
                padding: 12px;
            }

            .contact-row {
                flex-direction: column;
            }

            .button-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="details-container">
        <div id="empty-state">
            <p>📍 Selecciona una clínica en el mapa para ver los detalles</p>
        </div>
    </div>

    <script>
        'use strict';

        let currentClinic = null;

        /**
         * Listen for messages from the map iframe
         */
        window.addEventListener('message', (event) => {
            try {
                const data = event.data;

                if (data.type === 'CLINIC_SELECTED') {
                    currentClinic = data.clinic;
                    console.log('Clinic selected:', currentClinic);
                    displayClinicDetails(currentClinic);
                } else if (data.type === 'CLINIC_DESELECTED') {
                    currentClinic = null;
                    console.log('Clinic deselected');
                    displayEmptyState();
                }
            } catch (error) {
                console.error('Error handling message:', error);
            }
        });

        /**
         * Display clinic details in the panel
         */
        function displayClinicDetails(clinic) {
            if (!clinic) {
                displayEmptyState();
                return;
            }

            const container = document.getElementById('details-container');
            container.innerHTML = `
                <div class="clinic-panel">
                    <div class="clinic-header">
                        <h2>${escapeHtml(clinic.name || 'Sin nombre')}</h2>
                        <div class="clinic-code">Código: ${escapeHtml(clinic.code || 'N/A')}</div>
                    </div>
                    <div class="clinic-content">
                        ${renderAddressSection(clinic)}
                        ${renderDepartmentsSection(clinic)}
                        ${renderActionButtons(clinic)}
                    </div>
                </div>
            `;
        }

        /**
         * Render address section with Plus Code option
         */
        function renderAddressSection(clinic) {
            if (!clinic.address && !clinic.plusCode) return '';
            
            let html = `
                <div class="info-section">
                    <div class="info-section-title">📍 Ubicación</div>
                    <div class="address-block">
            `;

            if (clinic.address) {
                html += `<div>${escapeHtml(clinic.address)}</div>`;
            }

            if (clinic.plusCode) {
                html += `<div style="margin-top: 8px; font-size: 12px; color: #64748b;">Plus Code: <strong>${escapeHtml(clinic.plusCode)}</strong></div>`;
            }

            html += `
                    </div>
                    ${clinic.plusCode ? `
                        <div class="button-row" style="margin-top: 10px;">
                            <button class="btn btn-primary" onclick="placePinOnMap('${escapeAttribute(clinic.plusCode)}')">
                                📌 Ubicar en Mapa
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;

            return html;
        }

        /**
         * Render departments/sections with contact info
         */
        function renderDepartmentsSection(clinic) {
            if (!clinic.sections || Object.keys(clinic.sections).length === 0) {
                return '';
            }

            let html = `<div class="info-section"><div class="info-section-title">🏥 Departamentos</div>`;

            for (const [sectionKey, sectionData] of Object.entries(clinic.sections)) {
                if (!sectionData) continue;

                html += `<div class="section-block">`;
                html += `<div class="section-block-title">${escapeHtml(sectionKey)}</div>`;

                if (sectionData.name) {
                    html += `<div class="section-detail"><strong>Departamento:</strong> ${escapeHtml(sectionData.name)}</div>`;
                }

                // Contact information row
                const hasPhone = sectionData.phone || false;
                const hasFax = sectionData.fax || false;

                if (hasPhone || hasFax) {
                    html += `<div class="contact-row">`;
                    if (hasPhone) {
                        html += `
                            <div class="contact-item">
                                <div class="contact-label">📞 Teléfono</div>
                                <div class="contact-value">${escapeHtml(sectionData.phone)}</div>
                            </div>
                        `;
                    }
                    if (hasFax) {
                        html += `
                            <div class="contact-item">
                                <div class="contact-label">📠 Fax</div>
                                <div class="contact-value">${escapeHtml(sectionData.fax)}</div>
                            </div>
                        `;
                    }
                    html += `</div>`;
                }

                html += `</div>`;
            }

            html += `</div>`;
            return html;
        }

        /**
         * Render action buttons
         */
        function renderActionButtons(clinic) {
            if (!clinic.lat || !clinic.lng) return '';
            
            return `
                <div class="info-section">
                    <div class="button-row">
                        <button class="btn btn-secondary" onclick="copyCoordinates(${clinic.lat}, ${clinic.lng})">
                            📋 Copiar Coordenadas
                        </button>
                    </div>
                </div>
            `;
        }

        /**
         * Place pin on map using Plus Code
         */
        function placePinOnMap(plusCode) {
            if (window.parent !== window) {
                window.parent.postMessage({
                    type: 'PLACE_PIN',
                    plusCode: plusCode,
                    timestamp: new Date().toISOString()
                }, '*');
            }
            console.log('Sending PLACE_PIN message with Plus Code:', plusCode);
        }

        /**
         * Copy coordinates to clipboard
         */
        function copyCoordinates(lat, lng) {
            const coords = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            navigator.clipboard.writeText(coords).then(() => {
                alert('Coordenadas copiadas: ' + coords);
            }).catch(err => {
                console.error('Error copying coordinates:', err);
            });
        }

        /**
         * Display empty state
         */
        function displayEmptyState() {
            const container = document.getElementById('details-container');
            container.innerHTML = `
                <div id="empty-state">
                    <p>📍 Selecciona una clínica en el mapa para ver los detalles</p>
                </div>
            `;
        }

        /**
         * Escape HTML special characters
         */
        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        /**
         * Escape attribute values for onclick handlers
         */
        function escapeAttribute(text) {
            if (!text) return '';
            return String(text).replace(/'/g, "\\'").replace(/"/g, "&quot;");
        }

        // Notify parent that details panel is ready
        if (window.parent !== window) {
            window.parent.postMessage({
                type: 'CLINIC_DETAILS_READY',
                timestamp: new Date().toISOString()
            }, '*');
        }
    </script>
</body>
</html>
